name: PWA 빌드 검증 (CI)

on:
  push:
    branches: [main]
    paths:
      - 'pwa/**'
      - '02_devtools/design-audit.mjs'
      - '.github/workflows/ci-pwa-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pwa/**'
      - '02_devtools/design-audit.mjs'
      - '.github/workflows/ci-pwa-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PWA 빌드
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: node_modules 캐시
        uses: actions/cache@v6
        id: npm-cache
        with:
          path: pwa/node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('pwa/package-lock.json') }}

      - name: 의존성 설치
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci 실패 (시도 $i/3), 10초 후 재시도..."
            sleep 10
          done
          echo "::error::npm ci가 3회 모두 실패했습니다 (package-lock.json 동기화 확인 필요)"
          exit 1
        working-directory: pwa

      - name: 아이콘 생성
        run: npm run generate-icons
        working-directory: pwa

      # 게임 순수 로직(gameLogic·tgWordStats·streak·gameXp 등) 회귀 방어.
      # 테스트는 예전부터 있었지만 CI가 빌드만 돌려서 한 번도 실행되지 않고 있었다(2026-08-10 검수).
      - name: 단위 테스트
        run: npm test
        working-directory: pwa

      # 미사용 import·죽은 분기 탐지. 경고는 통과시키고 에러(no-undef 등)만 막는다.
      - name: 린트 (에러만)
        run: npx eslint src/ --quiet
        working-directory: pwa

      # 디자인 규칙 정적 검사 — 색 리터럴·deprecated API·transition:all 등(게임 포함). ERROR면 실패.
      # 로컬 검수 플로우(CLAUDE.md 1-bis)와 같은 기준을 CI에서도 강제한다(2026-08-31).
      - name: 디자인 규칙 검사
        run: node 02_devtools/design-audit.mjs --quiet

      - name: 빌드 검증
        run: npm run build
        working-directory: pwa

      # main push 실패만 critical 알림. PR 실패는 GitHub UI에서 확인 (알림 폭주 방지).
      - name: 알림 (main push 실패 시)
        if: failure() && github.event_name == 'push'
        env:
          NTFY_TOPIC_CRITICAL: ${{ secrets.NTFY_TOPIC_CRITICAL }}
        run: |
          if [ -z "$NTFY_TOPIC_CRITICAL" ]; then exit 0; fi
          MSG=$(printf 'main 브랜치 PWA 빌드가 실패했습니다.\n커밋: %s\n링크: %s/%s/actions/runs/%s' \
            "${{ github.sha }}" \
            "${{ github.server_url }}" \
            "${{ github.repository }}" \
            "${{ github.run_id }}")
          curl -fsS -X POST "https://ntfy.sh/$NTFY_TOPIC_CRITICAL" \
            -H "Title: PWA 빌드 실패" \
            -H "Priority: 5" \
            -H "Tags: rotating_light,package" \
            -d "$MSG"
