name: 무료상담/원데이클래스 전날 알림

on:
  # 1차 — 워커 cron이 정시에 깨운다 (worker/src/index.js HOURLY_JOBS — 17:00 KST).
  # GitHub schedule 트리거는 러너 혼잡에 몇 시간씩 밀려(2026-08-27 실측 8~11시간)
  # 정시 발송에는 쓰지 않는다.
  repository_dispatch:
    types: [consult-tomorrow]
  # 백업 — 워커가 못 깨웠을 때만 실제로 발송한다. 1차(17:00 KST)가 성공했으면
  # 스크립트의 shouldSkipBackupRun()이 GitHub 실행 이력을 보고 즉시 종료한다.
  schedule:
    - cron: '0 10 * * *'  # 19:00 KST
  workflow_dispatch:          # 수동 실행 가능

permissions:
  contents: read
  actions: read         # 중복 발송 방지 — 오늘 성공 실행 이력 조회

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: 무료상담/원데이클래스 전날 리마인더 발송
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GITHUB_REPOSITORY: ${{ github.repository }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_CRITICAL: ${{ secrets.NTFY_TOPIC_CRITICAL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
          SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
          KAKAO_PFID: ${{ secrets.KAKAO_PFID }}
          KAKAO_TPL_CONSULT_TOMORROW: ${{ secrets.KAKAO_TPL_CONSULT_TOMORROW }}
          KAKAO_TPL_ONEDAY_TOMORROW: ${{ secrets.KAKAO_TPL_ONEDAY_TOMORROW }}
        run: node 01_automation/notify_consult_tomorrow.mjs
