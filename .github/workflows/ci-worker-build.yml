name: Worker 번들 검증 (CI)

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/ci-worker-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/ci-worker-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Worker dry-run 빌드
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: node_modules 캐시
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: npm-cache
        with:
          path: worker/node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('worker/package-lock.json') }}

      - name: 의존성 설치
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci 실패 (시도 $i/3), 10초 후 재시도..."
            sleep 10
          done
          echo "::error::npm ci가 3회 모두 실패했습니다 (package-lock.json 동기화 확인 필요)"
          exit 1
        working-directory: worker

      - name: 단위 테스트 (Vitest)
        run: npm test
        working-directory: worker

      - name: Wrangler dry-run 빌드 검증
        run: npx wrangler deploy --dry-run --outdir=dist-check
        working-directory: worker

      # main push 실패만 critical 알림. PR 실패는 GitHub UI에서 확인 (알림 폭주 방지).
      - name: 알림 (main push 실패 시)
        if: failure() && github.event_name == 'push'
        env:
          NTFY_TOPIC_CRITICAL: ${{ secrets.NTFY_TOPIC_CRITICAL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          node 01_automation/ntfy_privacy.mjs NTFY_TOPIC_CRITICAL worker-build-failed
