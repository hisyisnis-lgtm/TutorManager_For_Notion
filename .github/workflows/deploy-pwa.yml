name: PWA 배포 (Cloudflare Pages)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: node_modules 캐시
        uses: actions/cache@v6
        id: npm-cache
        with:
          path: pwa/node_modules
          key: ${{ runner.os }}-node24-${{ hashFiles('pwa/package-lock.json') }}

      - name: 버전 동기화 (git 태그 → package.json)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          npm version "$VERSION" --no-git-tag-version || true
        working-directory: pwa

      - name: 의존성 설치
        if: steps.npm-cache.outputs.cache-hit != 'true'
        # ★3번 다 실패하면 **반드시 여기서 멈춘다**. 예전엔 루프가 그냥 끝나 exit 0이 되는 바람에
        #  lockfile이 깨져 npm ci가 실패해도 다음 단계로 넘어갔고, 엉뚱하게 "아이콘 생성"에서
        #  `pwa-assets-generator: not found`로 죽어 원인 파악이 늦어졌다(2026-08-10 배포 실패).
        run: |
          for i in 1 2 3; do
            npm ci && exit 0
            echo "npm ci 실패 (시도 $i/3), 10초 후 재시도..."
            sleep 10
          done
          echo "::error::npm ci가 3회 모두 실패했습니다 (package-lock.json 동기화 확인 필요)"
          exit 1
        working-directory: pwa

      - name: 아이콘 생성
        run: npm run generate-icons
        working-directory: pwa

      - name: PWA 빌드
        env:
          VITE_WORKER_URL: ${{ secrets.VITE_WORKER_URL }}
        run: npm run build
        working-directory: pwa

      - name: Cloudflare Pages 배포
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy pwa/dist --project-name=tiantian-chinese --branch=main --commit-dirty=true --commit-message="Deploy ${{ github.ref_name }}" --commit-hash=${{ github.sha }}
