name: Worker → ntfy 릴레이 (IP 우회)

on:
  repository_dispatch:
    types: [ntfy-relay]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: ntfy 발송
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_CRITICAL: ${{ secrets.NTFY_TOPIC_CRITICAL }}
          NTFY_TOPIC_WARN: ${{ secrets.NTFY_TOPIC_WARN }}
          NTFY_TOPIC_DIGEST: ${{ secrets.NTFY_TOPIC_DIGEST }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSH_PUBLISH_TOKEN: ${{ secrets.PUSH_PUBLISH_TOKEN }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: node 01_automation/notify_from_worker.mjs
