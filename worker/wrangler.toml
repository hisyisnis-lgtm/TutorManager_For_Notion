name = "tutor-manager-proxy"
main = "src/index.js"
compatibility_date = "2026-04-27"

# 워커 로그 보존(Workers Logs). 켜기 전에는 장애가 나도 남는 기록이 휴대폰 ntfy 푸시뿐이라
# 2026-08-06 Notion 장애 때 사후에 워커 로그를 열어볼 방법이 아예 없었다.
# 보존 기간은 Cloudflare 플랜을 따르며(무료 3일), 요청량이 적어 샘플링은 100%로 둔다.
[observability]
enabled = true
head_sampling_rate = 1

[vars]
ALLOWED_ORIGIN = "https://hisyisnis-lgtm.github.io"
LESSON_TYPE_PAGE_ID = "314838fa-f2a6-8070-82ad-e2494a9d7281"

# 게임 이벤트 측정(유입 깔때기) — POST /game/event → Analytics Engine.
# 계정 AE 활성화 완료(2026-07-04). 라우트는 `env.GAME_AE?.writeDataPoint`로 가드(바인딩 없으면 200 no-op).
# 대시보드 없이 SQL API로 조회: https://developers.cloudflare.com/analytics/analytics-engine/
[[analytics_engine_datasets]]
binding = "GAME_AE"
dataset = "tone_game_events"

# 게임 회원 계정 저장소 — Notion GAME_USERS에서 이전(2026-07-06). rich_text 2000자 트림 한계 제거.
# 스키마: migrations/0001_game_users.sql. 회원 데이터(게임데이터 JSON)를 game_data TEXT(무캡)에 저장.
[[d1_databases]]
binding = "GAME_DB"
database_name = "tone-game-users"
database_id = "1cb6265b-95e4-47cc-a0c8-5ac00266b9fa"

# NOTION_TOKEN은 아래 명령으로 등록 (이 파일에 직접 기입 금지)
# npx wrangler secret put NOTION_TOKEN
