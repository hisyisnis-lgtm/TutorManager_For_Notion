<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>성조게임 SFX 오디션 (Dustyroom)</title>
<style>
  body{font-family:'Noto Sans KR',system-ui,sans-serif;background:#fffdf8;color:#2b2730;margin:0;padding:20px;max-width:900px;margin:0 auto}
  h1{font-size:20px}h2{font-size:15px;color:#9a93a0;margin-top:28px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  button{font:inherit;border:1.5px solid #ebe5de;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
  button:hover{background:#fff1f1}
  .key{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #efeae4;border-radius:12px;padding:10px 12px;margin:4px}
  .key b{color:#f2484c}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
  .cell{border:1.5px solid #efeae4;border-radius:10px;padding:8px;text-align:center;background:#fff}
  .cell .num{font-weight:800;font-size:15px}
  .cell .use{font-size:11px;color:#f2484c;min-height:14px}
  .cell .dur{font-size:11px;color:#9a93a0}
  .hint{font-size:13px;color:#9a93a0;line-height:1.6}
</style>
</head>
<body>
<h1>🔊 성조게임 SFX 오디션 — Dustyroom Casual Game Sounds (CC0)</h1>
<p class="hint">현재 자동 배정된 14키를 먼저 들어보세요. 바꾸려면 <b>src/game/tgSfx.js</b>의 <b>SFX_FILES</b>에서 번호만 교체하면 됩니다. 아래 50개 전체도 들어볼 수 있어요.</p>

<h2>현재 배정 (키 → 파일)</h2>
<div id="keys"></div>

<h2>전체 50개 (클릭해서 듣기)</h2>
<div class="grid" id="all"></div>

<script>
const MAP = {
  tap:'21', button:'21', count:'03', correct:'26', combo:'28', score:'31',
  go:'07', wrong:'16', timeout:'04', win:'18', gameover:'12', unlock:'23',
  whoosh:'20', locked:'14',
};
const DESC = {
  tap:'부분정답 진행', button:'UI 버튼', count:'카운트다운 틱', correct:'정답', combo:'콤보',
  score:'점수/코인', go:'시작', wrong:'오답', timeout:'시간초과', win:'승리', gameover:'게임오버',
  unlock:'잠금해제', whoosh:'전환', locked:'잠금 거절',
};
function file(n){ return 'lib/DM-CGS-'+n+'.wav'; }
const audio = new Audio();
function playN(n){ audio.src=file(n); audio.currentTime=0; audio.play().catch(()=>{}); }

// 키 배정
const usedBy = {};
const keysEl = document.getElementById('keys');
for(const k of Object.keys(MAP)){
  const n = MAP[k]; usedBy[n] = k;
  const el = document.createElement('span'); el.className='key';
  el.innerHTML = '<b>'+k+'</b> <span style="color:#9a93a0">('+DESC[k]+')</span> · #'+n;
  const b = document.createElement('button'); b.textContent='▶'; b.onclick=()=>playN(n);
  el.prepend(b);
  keysEl.appendChild(el);
}

// 전체 50
const allEl = document.getElementById('all');
for(let i=1;i<=50;i++){
  const n = String(i).padStart(2,'0');
  const c = document.createElement('div'); c.className='cell';
  const use = usedBy[n] ? (usedBy[n]+' ('+DESC[usedBy[n]]+')') : '';
  c.innerHTML = '<div class="num">#'+n+'</div><div class="use">'+use+'</div>';
  const b = document.createElement('button'); b.textContent='▶ 듣기'; b.onclick=()=>playN(n);
  c.appendChild(b);
  allEl.appendChild(c);
}
</script>
</body>
</html>
