<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7f0005" />

    <!-- 강사가 공유하기 전까지는 검색엔진 인덱싱 금지 (robots.txt 와 이중 방어).
         OG 미리보기는 별개로 동작 — 카톡 등에서 공유 시 og:* 태그를 읽어감. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="1:1 맞춤 중국어 수업 수강료를 확인해보세요. 회화·발음 교정 전문 하늘쌤과 함께해요." />

    <!-- Open Graph (카카오톡·SNS 링크 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="하늘하늘중국어" />
    <meta property="og:title" content="수강료 안내 — 하늘하늘중국어" />
    <meta property="og:description" content="1:1 맞춤 중국어 수업 수강료를 확인해보세요. 회화·발음 교정 전문 하늘쌤과 함께해요." />
    <meta property="og:image" content="https://tiantian-chinese.pages.dev/img/%EC%B9%B4%EC%B9%B4%EC%98%A4%ED%86%A1%EB%A7%81%ED%81%AC%EB%AF%B8%EB%A6%AC%EB%B3%B4%EA%B8%B0%EC%9D%B4%EB%AF%B8%EC%A7%80_%EC%88%98%EA%B0%95%EB%A3%8C%EC%95%88%EB%82%B4.png" />
    <meta property="og:url" content="https://tiantian-chinese.pages.dev/pricing" />

    <title>수강료 안내 — 하늘하늘중국어</title>

    <!-- 검색엔진은 meta 태그만 읽고, 일반 방문자는 즉시 SPA(/#/pricing)로 이동.
         CSP의 script-src 'self' 정책을 회피하기 위해 JS 대신 meta refresh 사용. -->
    <meta http-equiv="refresh" content="0; url=/#/pricing" />
  </head>
  <body>
    <noscript>
      <p>잠시만 기다려주세요. <a href="/#/pricing">하늘하늘중국어 수강료 안내</a>로 이동합니다.</p>
    </noscript>
</html>
