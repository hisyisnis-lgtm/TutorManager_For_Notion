<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1730" />

    <!-- 성조게임 단독 앱 전용 엔트리 문서. 통합 웹(index.html)과 달리 강사/학생 UI·검색엔진 소유확인·
         학생 토큰 manifest 우회 스크립트가 없다. 네이티브(Capacitor) 래핑 대상. -->
    <meta name="description" content="성조 빨리 찾기 — 중국어 4성을 게임으로 익히는 발음 트레이닝." />
    <meta name="referrer" content="no-referrer" />

    <!-- iOS 웹뷰/홈스크린 설정 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="성조게임" />

    <title>성조게임 — 하늘하늘중국어</title>

    <!-- 성조게임 전용 폰트 (Jua 타이틀 · Baloo 2 숫자 · Noto Sans KR 본문) -->
    <!-- id=tg-fonts: 게임 모듈의 ensureGameFonts()가 중복 주입을 막기 위해 이 id를 확인함 -->
    <!-- TODO(P1): 네이티브 앱 오프라인·심사 대비 로컬 폰트 번들로 전환 (CDN 의존 제거) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      id="tg-fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jua&family=Baloo+2:wght@600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.game.jsx"></script>
  </body>
</html>
