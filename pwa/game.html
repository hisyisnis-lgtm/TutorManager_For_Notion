<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFDF8" />

    <!-- 성조게임 단독 앱 전용 엔트리 문서. 통합 웹(index.html)과 달리 강사/학생 UI·검색엔진 소유확인·
         학생 토큰 manifest 우회 스크립트가 없다. 네이티브(Capacitor)와 공식 사이트 게임이 공유한다. -->
    <meta name="description" content="매일매일 성조키우기 — 중국어 4성을 게임으로 익히는 발음 트레이닝." />
    <meta name="referrer" content="no-referrer" />

    <!-- iOS 웹뷰/홈스크린 설정 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="성조게임" />

    <!-- 파비콘은 벡터, 홈스크린은 같은 디자인의 PNG를 사용한다. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon-game.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon-game.png" />
    <link rel="canonical" href="https://tiantianchinese.com/game/tone/" />

    <!-- Open Graph (카카오톡·SNS 링크 공유 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="하늘하늘중국어" />
    <meta property="og:title" content="매일매일 성조키우기 — 중국어 4성 게임" />
    <meta property="og:description" content="중국어 4성을 게임으로 빠르게 익히기. 하늘하늘중국어 성조 트레이닝." />
    <meta property="og:url" content="https://tiantianchinese.com/game/tone/" />
    <meta property="og:image" content="https://tiantianchinese.com/game/tone/game-og-v3.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>매일매일 성조키우기 — 하늘하늘중국어</title>

    <!-- 폰트는 @fontsource로 번들(main.game.jsx) — CDN 의존 없이 오프라인 동작. -->
    <!-- Jua(타이틀)·Baloo 2(숫자)는 로컬 번들, 한글 본문은 시스템 폰트(Android=Noto CJK). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.game.jsx"></script>
  </body>
</html>
