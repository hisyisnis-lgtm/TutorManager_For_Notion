<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7f0005" />

    <!-- iOS Safari PWA quirk 우회: 학생 path 진입 시 manifest link를 페이지 파싱 즉시 제거.
         iOS는 manifest가 있으면 start_url을 자기 마음대로 해석(hash·query 제거, '.'을 root 해석)해
         학생 토큰을 잃어버리지만, manifest 자체가 없으면 "홈 화면에 추가" 시 현재 페이지 URL을
         그대로 PWA의 시작 URL로 사용한다 — path 기반 학생 URL이 그대로 보존됨.
         React 마운트는 너무 늦으므로 vite-plugin-pwa가 주입하는 link를 MutationObserver로 즉시 가로챈다. -->
    <script>
      (function () {
        try {
          if (!/^\/(personal|student)\//.test(window.location.pathname)) return;
          var ua = navigator.userAgent || '';
          var isIOS = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && (navigator.maxTouchPoints || 0) > 1);
          if (!isIOS) return;
          var removeAll = function () {
            var links = document.querySelectorAll('link[rel="manifest"]');
            for (var i = 0; i < links.length; i++) links[i].remove();
          };
          removeAll();
          var mo = new MutationObserver(function (mutations) {
            for (var i = 0; i < mutations.length; i++) {
              var added = mutations[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                var n = added[j];
                if (n.nodeName === 'LINK' && n.getAttribute && n.getAttribute('rel') === 'manifest') {
                  n.remove();
                }
              }
            }
          });
          mo.observe(document.documentElement, { childList: true, subtree: true });
          // DOM 로드 후엔 추가될 일이 거의 없으니 적당히 종료해 메모리 해제
          window.addEventListener('load', function () { mo.disconnect(); }, { once: true });
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="10년 경력 중국어 전문 강사 하늘쌤과 함께 회화·발음 교정을 체계적으로. Zoom 30분 무료 상담 진행 중." />

    <!-- 학생 토큰이 URL hash에 노출되어도 외부 사이트에 새지 않도록 referrer 차단 -->
    <!-- (X-Frame-Options / X-Content-Type-Options는 HTTP 헤더 전용 → public/_headers에서 설정) -->
    <meta name="referrer" content="no-referrer" />

    <!-- Open Graph (카카오톡·SNS 링크 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="하늘하늘중국어" />
    <meta property="og:title" content="하늘하늘중국어 — 중국어 회화·발음 교정 전문" />
    <meta property="og:description" content="10년 경력 중국어 전문 강사 하늘쌤과 함께 회화·발음 교정을 체계적으로. Zoom 30분 무료 상담 진행 중." />
    <meta property="og:image" content="https://tiantian-chinese.pages.dev/pwa-512x512.png" />
    <meta property="og:url" content="https://tiantian-chinese.pages.dev/#/intro" />

    <!-- iOS PWA 설정 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="하늘하늘중국어" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>하늘하늘중국어</title>

      rel="stylesheet"

    />
