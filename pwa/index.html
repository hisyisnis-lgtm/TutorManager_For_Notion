<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7f0005" />

    <!-- iOS Safari PWA quirk 우회: vite-plugin-pwa의 manifest 자동 주입을 비활성화하고
         학생 path가 아닐 때만 이 inline script가 manifest link를 동적으로 추가한다.
         iOS는 manifest가 있으면 start_url을 자기 마음대로 해석(hash·query 제거, '.'을 root 해석)해
         학생 토큰을 잃어버리지만, manifest 자체가 없으면 "홈 화면에 추가" 시 현재 페이지 URL을
         그대로 PWA의 시작 URL로 사용한다 — path 기반 학생 URL이 그대로 보존됨. -->
    <script>
      (function () {
        try {
          // 학생 path(`/personal/...` 또는 `/student/...`) 진입 시엔 manifest link를 절대 추가하지 않는다.
          if (/^\/(personal|student)\//.test(window.location.pathname)) return;
          // 그 외에는 정적 manifest 파일을 link로 추가 (강사 라우트·랜딩 페이지 등의 PWA 설치 흐름).
          var link = document.createElement('link');
          link.rel = 'manifest';
          link.href = '/manifest.webmanifest';
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="10년 경력 중국어 전문 강사 하늘쌤과 함께 회화·발음 교정을 체계적으로. Zoom 30분 무료 상담 진행 중." />

    <!-- 학생 토큰이 URL hash에 노출되어도 외부 사이트에 새지 않도록 referrer 차단 -->
    <!-- (X-Frame-Options / X-Content-Type-Options는 HTTP 헤더 전용 → public/_headers에서 설정) -->
    <meta name="referrer" content="no-referrer" />

    <!-- Open Graph (카카오톡·SNS 링크 미리보기) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="하늘하늘중국어" />
    <meta property="og:title" content="하늘하늘중국어 — 중국어 회화·발음 교정 전문" />
    <meta property="og:description" content="10년 경력 중국어 전문 강사 하늘쌤과 함께 회화·발음 교정을 체계적으로. Zoom 30분 무료 상담 진행 중." />
    <meta property="og:image" content="https://tiantian-chinese.pages.dev/pwa-512x512.png" />
    <meta property="og:url" content="https://tiantian-chinese.pages.dev/#/intro" />

    <!-- iOS PWA 설정 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="하늘하늘중국어" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>하늘하늘중국어</title>

    <!-- Pretendard 폰트 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
